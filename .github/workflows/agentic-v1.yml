name: BuildAWallet CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile main.py agent_protocol.py chains.py evm.py solana_adapter.py utxo_adapter.py pricing.py wallet_crypto.py mcp_server.py app/brain.py app/catalog.py
      - name: Test
        run: pytest -q
      - name: Verify extension vault primitive
        run: node tests/vault.mjs
      - name: Verify agent Worker fails closed
        run: node tests/agent_worker.mjs
  extension-testnet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension-wallet/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: extension-wallet
      - run: npm test
        working-directory: extension-wallet
      - run: npm run build
        working-directory: extension-wallet
