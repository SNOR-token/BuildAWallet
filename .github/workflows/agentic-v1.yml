name: BuildAWallet CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile main.py agent_protocol.py chains.py evm.py solana_adapter.py utxo_adapter.py pricing.py wallet_crypto.py mcp_server.py app/brain.py app/catalog.py
      - name: Test
        run: pytest -q
      - name: Ensure no database is tracked
        run: test -z "$(git ls-files 'data/*.db*')"
