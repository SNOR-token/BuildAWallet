name: Agentic v1 CI

on:
  push:
    branches:
      - agentic-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile main.py agent_protocol.py chains.py evm.py solana_adapter.py utxo_adapter.py pricing.py wallet_crypto.py mcp_server.py app/brain.py app/catalog.py
      - name: Test
        env:
          DATA_DIR: /tmp/baw-ci-data
          AGENT_BOOTSTRAP_SECRET: ci-bootstrap-secret
          BAW_MASTER_KEY: ci-master-key-with-at-least-32-bytes-of-entropy
        run: pytest -q
